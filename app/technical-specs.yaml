application:
  name: Travel Planner
  description: A web application that recommends travel destinations.

backend:
  language:
    name: Python
    version: "3.12.0"

  framework:
    name: Flask
    version: "3.1.3"

  packages:
    - name: Werkzeug
      version: "3.1.9"

frontend:
  technologies:
    - HTML
    - CSS

database:
  name: PostgreSQL
  version: "18.6"
  status: "Planned"
  server: localhost
  database_name: postgres
  port: 5432
  username: postgres
  password: "Set locally"
  prompt: "postgres=#"

version_control:
  name: Git
  version: "2.50.1"

containerisation:
  name: Docker
  version: "29.9.2"
  status: "Installed"